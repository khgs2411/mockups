<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mockups</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b0c;color:#e9e6e1;font:16px/1.5 system-ui,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  .note{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  .note h1{font-size:20px;margin:0 0 8px}
  .note p{margin:0;color:#9a958e}
  code{color:#e9e6e1}
</style>
</head>
<body>
<script>
// ?mockups=<name> picks a site folder under sites/. The name is normalised, so
// "Israel Tech Force", "israel-tech-force" and "israeltechforce" all reach sites/israeltechforce/.
const raw = new URLSearchParams(location.search).get("mockups");
const slug = (raw || "").toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");

function note(title, text) {
  document.body.insertAdjacentHTML("beforeend",
    `<main class="note"><div><h1>${title}</h1><p>${text}</p></div></main>`);
}

if (!slug) {
  note("Mockups", "Add <code>?mockups=&lt;name&gt;</code> to the address to open a mockup.");
} else {
  const src = `sites/${encodeURIComponent(slug)}/`;
  fetch(src, { method: "HEAD" }).then(res => {
    if (!res.ok) return note("Mockup not found", `No mockup is called “${raw}”.`);
    const frame = document.createElement("iframe");
    frame.src = src + location.hash;
    frame.title = raw;
    frame.addEventListener("load", () => {
      const doc = frame.contentDocument;
      if (doc) {
        document.title = doc.title;
        document.documentElement.lang = doc.documentElement.lang;
        document.documentElement.dir = doc.documentElement.dir;
      }
      frame.contentWindow.focus();
    });
    document.body.append(frame);
  }, () => note("Mockup unavailable", "The mockup could not be loaded. Check your connection and try again."));
}
</script>
</body>
</html>
